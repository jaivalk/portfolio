  <!-- Theme generation moved to shared.js and initialized immediately -->
  <script>
    // Prevent FOUC by initializing theme before body rendering
    let isReload = false;
    const navEntries = performance.getEntriesByType('navigation');
    if (navEntries.length > 0 && navEntries[0].type === 'reload') {
      isReload = true;
    }
    let themeColor = sessionStorage.getItem('themeColor');
    let textColor = sessionStorage.getItem('textColor');
    if (!themeColor || !textColor || isReload) {
      const h = Math.floor(Math.random() * 360);
      const s = Math.floor(50 + Math.random() * 50);
      let isDark = Math.random() > 0.5;
      const l = isDark ? Math.floor(5 + Math.random() * 15) : Math.floor(80 + Math.random() * 15);
      themeColor = `hsl(${h}, ${s}%, ${l}%)`;
      textColor = l > 60 ? '#000000' : '#FFFFFF';
      sessionStorage.setItem('themeColor', themeColor);
      sessionStorage.setItem('textColor', textColor);
      if (!sessionStorage.getItem('visited')) { document.documentElement.classList.add('initial-load'); }
      
      // Fetch and inject SVG for tracing animation
      fetch('fish_chinese.svg')
        .then(r => r.text())
        .then(svgText => {
          const parser = new DOMParser();
          const svgDoc = parser.parseFromString(svgText, 'image/svg+xml');
          const svgEl = svgDoc.documentElement;
          svgEl.classList.add('fish-svg-bg');
          
          const inject = () => {
            document.body.appendChild(svgEl);
            // Wait for browser layout to calculate length correctly
            requestAnimationFrame(() => {
              const paths = Array.from(svgEl.querySelectorAll('path'));
              const totalPaths = paths.length;
              paths.forEach((path, i) => {
                const length = (path.getTotalLength() || 5000) + 10; // Pad to prevent gaps
                path.style.setProperty('--len', length + 'px');
                
                // Stagger delay from 0s to 2s
                const traceDelay = (i / totalPaths) * 2;
                
                // Apply animation dynamically: trace takes 2s, fill waits for 4s total
                path.style.animation = `trace-fish 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards ${traceDelay}s, fill-fish 0.1s forwards 4s`;
              });
            });
          };
          
          if (document.body) inject();
          else window.addEventListener('DOMContentLoaded', inject);
        });
    }
    document.documentElement.style.setProperty('--bg-color', themeColor);
    document.documentElement.style.setProperty('--text-color', textColor);
    if (sessionStorage.getItem('visited')) document.documentElement.classList.add('has-visited');
    if (sessionStorage.getItem('transitionDirection')) document.documentElement.classList.add('is-juggling');
  </script>
