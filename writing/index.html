<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://jaival.nfy.fyi/writing/">
  <title>Writing | Jaival Kachiwala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=5">
  <script>
    let isReload = false;
    const navEntries = performance.getEntriesByType('navigation');
    if (navEntries.length > 0 && navEntries[0].type === 'reload') {
      isReload = true;
    }
    let themeColor = sessionStorage.getItem('themeColor');
    let textColor = sessionStorage.getItem('textColor');
    if (!themeColor || !textColor || isReload) {
      const h = Math.floor(Math.random() * 360);
      const s = Math.floor(50 + Math.random() * 50);
      let isDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : Math.random() > 0.5;
      const l = isDark ? Math.floor(5 + Math.random() * 15) : Math.floor(80 + Math.random() * 15);
      themeColor = `hsl(${h}, ${s}%, ${l}%)`;
      textColor = l > 60 ? '#000000' : '#FFFFFF';
      sessionStorage.setItem('themeColor', themeColor);
      sessionStorage.setItem('textColor', textColor);
    }
    document.documentElement.style.setProperty('--bg-color', themeColor);
    document.documentElement.style.setProperty('--text-color', textColor);
    if (sessionStorage.getItem('visited')) document.documentElement.classList.add('has-visited');
    if (sessionStorage.getItem('transitionDirection')) document.documentElement.classList.add('is-juggling');
  </script>
</head>
<body>
  <div id="status-bar" style="justify-content: center;">
    <div class="availability-wrapper" id="availability-wrapper">
      <span id="freelance-text">Available for Freelance</span>
    </div>

  <div id="announcement-bar">
    <footer>
      <a href="../">home</a>
      <a href="#" class="active">writing</a>
      <a href="../who-am-i">who am i</a>
      <a href="../certificates">certificates</a>
      <button id="theme-toggle">Re-roll Theme</button>
    </footer>
    <div id="live-clock"></div>
    <script>!function(){var n=new Date(),t=n.toLocaleTimeString('en-US',{timeZone:'Asia/Kolkata',hour12:true,hour:'2-digit',minute:'2-digit'}),y=n.toLocaleString('en-US',{timeZone:'Asia/Kolkata',year:'numeric'});document.getElementById('live-clock').textContent='Surat \u2022 '+y+' \u2022 '+t}()</script>
  </div>
  
  <div class="container">
    <header>
      <h1 class="name">writing</h1>
      <div class="bio">notes and thoughts</div>
    </header>
    
    <main>

  <script src="../shared.js?v=2"></script>
</body>
</html>
