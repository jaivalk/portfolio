  <!-- Theme generation moved to shared.js and initialized immediately -->
  <script>
    // Prevent FOUC by initializing theme before body rendering
    let isReload = false;
    const navEntries = performance.getEntriesByType('navigation');
    if (navEntries.length > 0 && navEntries[0].type === 'reload') {
      isReload = true;
    }
    document.documentElement.style.setProperty('--bg-color', '#000000');
    document.documentElement.style.setProperty('--text-color', '#F3E5AB');
    if (sessionStorage.getItem('visited_v2')) document.documentElement.classList.add('has-visited');
    if (sessionStorage.getItem('transitionDirection')) {
        document.documentElement.classList.add('is-juggling');
    } else {
        document.documentElement.classList.add('initial-load');
    }
  </script>
